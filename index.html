
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weatherly - Your Daily Forecast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="brand">
      <div class="brand-icon">☀</div>
      <div>
        <p class="eyebrow">YOUR DAILY FORECAST</p>
        <h1>Weatherly</h1>
      </div>
    </header>

    <form id="weather-form" class="search-form">
      <input id="city-input" type="text" value="Anand"
        placeholder="Search a city" aria-label="City name" required>
      <button type="submit" aria-label="Search">➜</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section class="current-weather">
      <h2 id="location-name">Search a city</h2>
      <p class="eyebrow">CURRENT CONDITIONS</p>

      <img id="weather-icon" alt="Weather icon" hidden>

      <p id="temperature" class="temperature">--°C</p>
      <p id="description">Search a city to get started</p>
    </section>

    <section class="details-grid">
      <article class="detail-card">
        <span class="detail-icon">🌡️</span>
        <p>Feels like</p>
        <strong id="feels-like">—</strong>
      </article>

      <article class="detail-card">
        <span class="detail-icon">💧</span>
        <p>Humidity</p>
        <strong id="humidity">—</strong>
      </article>

      <article class="detail-card">
        <span class="detail-icon">💨</span>
        <p>Wind speed</p>
        <strong id="wind-speed">—</strong>
      </article>
    </section>

    <section class="forecast-section">
      <p class="eyebrow">PLAN AHEAD</p>
      <h2>5-day forecast</h2>
      <div id="forecast-list" class="forecast-grid">
        <p>Your forecast will appear here.</p>
      </div>
    </section>

    <footer>
      ☁ Weather data powered by OpenWeatherMap
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
